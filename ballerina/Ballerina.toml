[package]
distribution = "2201.12.0"
org = "ballerinax"
name = "telegram"
version = "0.9.4"
authors = ["Ballerina"]
repository = "https://github.com/ballerina-platform/module-ballerinax-telegram"
keywords = ["Communication/Telegram", "Cost/Free", "Vendor/Telegram", "Area/Communication", "Type/Connector", "Type/Trigger"]
icon = "icon.png"
license = ["Apache-2.0"]
include = ["metadata/**"]

[build-options]
observabilityIncluded = true

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerinax"
artifactId = "telegram-native"
version = "0.9.4"
path = "../native/build/libs/telegram-native-0.9.4.jar"
